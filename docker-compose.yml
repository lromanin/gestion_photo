services:
  photo-manager:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1500}
        APP_GID: ${APP_GID:-1500}
    container_name: photo-manager
    restart: unless-stopped
    volumes:
      - /mnt/maisonprincipal/Medias/photos_new/photos_et_videos:/data/photos_et_videos
      - /mnt/maisonprincipal/Medias/photos_new/_a_trier:/data/a_trier
      - /mnt/maisonprincipal/Medias/photos_new/_doublons_detectes:/data/doublons_detectes
      - /mnt/maisonprincipal/Medias/photos_new/_sans_date_exif:/data/sans_date_exif
      - /mnt/maisonprincipal/Projets_donnees/gestion_photo:/data/app_data
